syntax = "proto3";

package kvarn.v1;

message ExecRequest {
  string command = 1;
  repeated string args = 2;
  string working_dir = 3;
  bool privileged = 4;
  // Optional timeout in seconds. If > 0, the command will be killed after this duration.
  uint32 timeout_seconds = 5;
  // Optional cap on the bytes of stdout and of stderr returned, applied to
  // each stream separately. The two ends of the stream are kept and the middle
  // is dropped. 0 returns everything, which is what callers that parse the
  // output must ask for.
  uint32 max_output_bytes = 6;
}

message ExecResponse {
  int32 exit_code = 1;
  string stdout = 2;
  string stderr = 3;
  // Bytes the command wrote to each stream, set only when max_output_bytes
  // dropped part of it.
  uint64 stdout_total_bytes = 4;
  uint64 stderr_total_bytes = 5;
}

message FileContent {
  string path = 1;
  bytes content = 2;
  uint32 mode = 3;
  // If set, create a symlink at path pointing to this target instead of writing content.
  string symlink_target = 4;
}

message UploadFilesRequest {
  string working_dir = 1;
  repeated FileContent files = 2;
}

message UploadFilesResponse {
  int32 files_written = 1;
}

// TaggedLine is a single line of a file with an opaque anchor token. The token
// is a single English word drawn from a curated vocabulary, optionally suffixed
// with `:<hex>` when two distinct lines in the same file would otherwise map to
// the same word. It is used to reference the line in subsequent EditFile calls
// without requiring the agent to reproduce the line verbatim.
message TaggedLine {
  int32 line = 1;
  string hash = 2;
  string content = 3;
}

message ReadFileRequest {
  string working_dir = 1;
  string path = 2;
  // 1-indexed start line; 0 means from the beginning of the file.
  int32 start_line = 3;
  // 1-indexed inclusive end line; 0 means to the end of the file.
  int32 end_line = 4;
}

message ReadFileResponse {
  // Hex blake2s of the full file bytes. Pass back as expected_version on
  // EditFile/WriteFile to detect stale edits.
  string version = 1;
  int32 total_lines = 2;
  repeated TaggedLine lines = 3;
  // Newline style observed in the file ("\n" or "\r\n"). Informational only.
  string newline = 4;
}

enum EditOp {
  EDIT_OP_UNSPECIFIED = 0;
  EDIT_OP_REPLACE = 1;
  EDIT_OP_REPLACE_RANGE = 2;
  EDIT_OP_INSERT_AFTER = 3;
  EDIT_OP_DELETE = 4;
  EDIT_OP_DELETE_RANGE = 5;
  EDIT_OP_INSERT_BEFORE = 6;
}

message EditOperation {
  EditOp op = 1;
  // Single-line ops use hash to locate the line. line is an optional tiebreaker
  // used only when the same anchor matches multiple distinct lines in the file.
  int32 line = 2;
  string hash = 3;
  // Range ops use start_hash and end_hash to locate the bounds; start_line and
  // end_line are optional tiebreakers (see line above).
  int32 start_line = 4;
  string start_hash = 5;
  int32 end_line = 6;
  string end_hash = 7;
  // Replacement / insertion content. Each entry is one line, without terminators.
  repeated string lines = 8;
}

message EditFileRequest {
  string working_dir = 1;
  string path = 2;
  // Optional/advisory: the version returned by the most recent ReadFile. When
  // present and mismatched, the runner still applies the edit if every op's
  // anchor still resolves uniquely, and signals the drift via
  // EditFileResponse.version_drift.
  string expected_version = 3;
  repeated EditOperation operations = 4;
  // Lines of fresh tagged context around each edit in the response. 0 means default (5).
  int32 context_lines = 5;
}

message EditFileResponse {
  string version = 1;
  int32 total_lines = 2;
  // Fresh tagged context around each touched region.
  repeated TaggedLine context = 3;
  // True when expected_version was supplied but did not match the file's
  // current version. The edit still succeeded because all op anchors resolved;
  // the agent should consider re-reading the file before further work since
  // anchors elsewhere in the file may be stale.
  bool version_drift = 4;
}

message WriteFileRequest {
  string working_dir = 1;
  string path = 2;
  bytes content = 3;
  // Empty = create-only (fails if the file exists). Non-empty = overwrite with
  // version check (must match current file hash).
  string expected_version = 4;
  // File mode. 0 means default (0644).
  uint32 mode = 5;
}

message WriteFileResponse {
  string version = 1;
  int32 total_lines = 2;
}

message CreateSessionRequest {
  string working_dir = 1;
}

message CreateSessionResponse {
  string session_id = 1;
}

message SessionExecRequest {
  string session_id = 1;
  string command = 2;
  uint32 timeout_seconds = 3;
  // Optional cap on the bytes of stdout and of stderr returned, applied to
  // each stream separately. The two ends of the stream are kept and the middle
  // is dropped. 0 returns everything. Streaming output is unaffected: the
  // incremental chunks are delivered in full regardless of this cap.
  uint32 max_output_bytes = 4;
}

message SessionExecResponse {
  int32 exit_code = 1;
  string stdout = 2;
  string stderr = 3;
  string working_dir = 4;
  // True if the shell died (e.g. `exit` was called) and was respawned.
  // All prior session state (env vars, cwd) has been lost.
  bool state_reset = 5;
  // Bytes the command wrote to each stream, set only when max_output_bytes
  // dropped part of it.
  uint64 stdout_total_bytes = 6;
  uint64 stderr_total_bytes = 7;
}

message CloseSessionRequest {
  string session_id = 1;
}

message CloseSessionResponse {}

// StartProcessRequest launches a process that outlives the call that started
// it. Unlike Exec and SessionExec, which return when the command is done, this
// returns as soon as the process is running and leaves it to be stopped
// explicitly (or reaped when the runner's handler closes).
message StartProcessRequest {
  // ProcessId is assigned by the caller rather than the runner. Output chunks
  // are keyed on it and can start arriving the instant the process is spawned,
  // so the caller has to know the key before it asks for the process — a
  // runner-assigned ID would race its own first line of output.
  string process_id = 1;
  // Name is a human-readable label carried on events and log lines.
  string name = 2;
  // Command is run through `sh -c`, so shell syntax is available.
  string command = 3;
  string working_dir = 4;
  // Env adds to the environment the login shell already sets up; it does not
  // replace it.
  map<string, string> env = 5;
}

message StartProcessResponse {
  string process_id = 1;
  int32 pid = 2;
}

message StopProcessRequest {
  string process_id = 1;
  // GraceSeconds is how long the process group is given after SIGTERM before
  // it is SIGKILLed. 0 takes the runner's default.
  uint32 grace_seconds = 2;
}

message StopProcessResponse {
  // ExitCode is the status the process finally reported; -1 when it had
  // already gone before the stop was asked for.
  int32 exit_code = 1;
}

message ListProcessesRequest {}

message ProcessInfo {
  string process_id = 1;
  string name = 2;
  int32 pid = 3;
  bool running = 4;
  // ExitCode is meaningful only once running is false.
  int32 exit_code = 5;
}

message ListProcessesResponse {
  repeated ProcessInfo processes = 1;
}

service RunnerService {
  rpc Exec(ExecRequest) returns (ExecResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc SessionExec(SessionExecRequest) returns (SessionExecResponse);
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
  rpc UploadFiles(UploadFilesRequest) returns (UploadFilesResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc EditFile(EditFileRequest) returns (EditFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  rpc StartProcess(StartProcessRequest) returns (StartProcessResponse);
  rpc StopProcess(StopProcessRequest) returns (StopProcessResponse);
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
}
