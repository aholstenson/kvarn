syntax = "proto3";

package kvarn.v1;

import "google/protobuf/timestamp.proto";
import "kvarn/v1/bridge.proto";

message StartJobRequest {
  string project = 1;
  string prompt = 2;
  string branch = 3;
  string mode = 4;
}

message StartJobResponse {
  string session_id = 1;
}

// SubmitFeedbackRequest continues work on an existing pull request: the agent
// runs against the PR's head branch and pushes a follow-up commit to it.
message SubmitFeedbackRequest {
  string project = 1;
  // Opaque to kvarn; interpreted by the project's forge.
  string pr_ref = 2;
  string feedback = 3;
  // Optional; defaults to "feedback".
  string mode = 4;
}

message SubmitFeedbackResponse {
  string session_id = 1;
}

// CancelJobRequest stops a run that is still in flight. Cancelling a session
// that has already reached a terminal state is an error, so a caller can tell
// whether the request actually stopped anything.
message CancelJobRequest {
  string session_id = 1;
  // Optional; recorded on the session as the cancellation message.
  string reason = 2;
}

message CancelJobResponse {
  // State the session was in when the cancellation was requested.
  string previous_state = 1;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  string session_id = 1;
  string project = 2;
  string state = 3;
  string message = 4;
  string error = 5;
  string prompt = 6;
  string pull_request_url = 7;
  string mode = 8;
  CostReport cost = 9;
  // Pull request the session works on: the forge-opaque ref, the branch the
  // commits land on, and the branch it targets. Populated once a fresh job
  // opens its PR, and from the start for a feedback run.
  string pr_ref = 10;
  string head_branch = 11;
  string base_branch = 12;
  // Session this one continues from, when it was started as a feedback run.
  // Empty when there was no parent or the parent has been pruned.
  string parent_session_id = 13;
  // When the submission was accepted, and when the session was last written.
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  // When the job last entered the durable backlog. Equal to created_at for a
  // fresh submission and moved forward by a requeue, so the wait a client
  // should report is measured from here rather than from created_at.
  google.protobuf.Timestamp queued_at = 16;
  // Backlog ordering inputs: the priority captured from project config at
  // submission, and how many times the job has been dispatched. Attempts above
  // one means a restart returned it to the backlog.
  int32 priority = 17;
  int32 attempts = 18;
}

// CostReport carries accumulated LLM spend for a job: totals across all
// models plus a per-model breakdown keyed by service name.
message CostReport {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 cached_tokens = 3;
  double total_usd = 4;
  repeated ModelCost per_model = 5;
}

message ModelCost {
  string model_id = 1;
  int64 input_tokens = 2;
  int64 output_tokens = 3;
  int64 cached_tokens = 4;
  double total_usd = 5;
}

// CostUpdate is broadcast on the session event stream when the budget warn
// threshold is crossed, when the hard cap is reached, and once at the end of
// each run as a final summary.
message CostUpdate {
  CostUpdateKind kind = 1;
  CostReport report = 2;
  double limit_usd = 3;
  double warn_fraction = 4;
}

enum CostUpdateKind {
  COST_UPDATE_KIND_UNSPECIFIED = 0;
  COST_UPDATE_KIND_WARNING = 1;
  COST_UPDATE_KIND_OVER_BUDGET = 2;
  COST_UPDATE_KIND_FINAL = 3;
}

message ListSessionsRequest {
  // Filter to a single project; empty means any project the caller may access.
  string project = 1;
  // When true, only non-terminal (active) sessions are returned. Redundant
  // with an explicit `states` list and applied on top of it.
  bool active_only = 2;
  // Maximum sessions to return; 0 lets the server pick a default.
  int32 limit = 3;
  // Opaque cursor from a previous response's next_page_cursor; empty starts
  // from the most recent session.
  string page_cursor = 4;
  // Exact states to include; empty means every state. An unknown state is
  // rejected rather than silently matching nothing.
  repeated string states = 5;
  // Agent mode to filter on; empty means any.
  string mode = 6;
  // Pull request the session works on, in the forge's own format; empty means
  // any. Selects a PR's whole run history, original job and follow-ups alike.
  string pr_ref = 7;
  // Only sessions created strictly after this instant. Unset means no bound.
  google.protobuf.Timestamp created_after = 8;
}

message ListSessionsResponse {
  repeated GetSessionResponse sessions = 1;
  // Opaque cursor to pass as the next request's page_cursor; empty when the
  // last page has been returned.
  string next_page_cursor = 2;
}

message WatchSessionRequest {
  string session_id = 1;
  // Resume cursor: only events with sequence > from_sequence are delivered.
  // 0 streams the full available history before live events.
  int64 from_sequence = 2;
}

message ListSessionEventsRequest {
  string session_id = 1;
  // Only events with sequence > after_sequence are returned.
  int64 after_sequence = 2;
  // Maximum events to return; 0 lets the server pick a default.
  int32 limit = 3;
}

message ListSessionEventsResponse {
  repeated SessionUpdate events = 1;
  // Sequence of the last event in this page; pass as the next request's
  // after_sequence to continue polling.
  int64 last_sequence = 2;
}

message SessionUpdate {
  string session_id = 1;
  string project = 2;
  // Durable per-session sequence number; 0 for ephemeral (live-only) events.
  int64 sequence = 3;

  oneof event {
    StateChange state_change = 10;
    AgentMessage agent_message = 11;
    AgentToolUse agent_tool_use = 12;
    AgentToolResult agent_tool_result = 13;
    StepResult step_result = 14;
    VmInfo vm_info = 15;
    StepOutput step_output = 16;
    TransferProgress transfer_progress = 17;
    DependencyOutput dependency_output = 18;
    CacheProgress cache_progress = 19;
    PullRequestCreated pull_request_created = 20;
    CostUpdate cost_update = 21;
  }
}

message StateChange {
  string state = 1;
  string message = 2;
  string error = 3;
}

message AgentMessage {
  string text = 1;
  bool final = 2;
  // Empty for the parent agent; identifier of the sub-agent run otherwise.
  string agent_id = 3;
}

message AgentToolUse {
  string tool_id = 1;
  string arguments_json = 2;
  string agent_id = 3;
}

message AgentToolResult {
  string tool_id = 1;
  string result = 2;
  bool is_error = 3;
  string agent_id = 4;
}

enum StepPhase {
  STEP_PHASE_UNSPECIFIED = 0;
  STEP_PHASE_SETUP = 1;
  STEP_PHASE_HEALTH_CHECK = 2;
  STEP_PHASE_VALIDATION_REQUIRED = 3;
  STEP_PHASE_VALIDATION_ADVISORY = 4;
}

message StepResult {
  string name = 1;
  StepPhase phase = 2;
  int32 exit_code = 3;
  string stdout = 4;
  string stderr = 5;
  bool passed = 6;
  bool skipped = 7;
}

message StepOutput {
  string name = 1;
  StepPhase phase = 2;
  string stdout = 3;
  string stderr = 4;
}

message TransferProgress {
  int64 bytes_sent = 1;
  int64 total_bytes = 2;
}

message DependencyOutput {
  string stdout = 1;
  string stderr = 2;
}

message CacheProgress {
  string path = 1;
  int32 index = 2;
  int32 total = 3;
  bool restoring = 4;
}

message PullRequestCreated {
  string url = 1;
  // Tag 2 held an int32 `number`. The identifier is now the forge-opaque
  // `ref`; reusing the tag would misparse persisted history.
  reserved 2;
  reserved "number";
  string branch = 3;
  // Opaque to kvarn; interpreted by the forge that produced it.
  string ref = 4;
}

// CancelJobsRequest stops every job matching a filter. It exists because the
// states worth cancelling in bulk — a backlog that built up behind a broken
// project, a burst submitted by mistake — are exactly the ones a caller cannot
// enumerate by session id up front.
//
// The filter fields are ANDed. A request that sets none of them cancels every
// active job on the host and must therefore say so with `all`, so no
// abbreviated command line can drain the queue by accident.
message CancelJobsRequest {
  string project = 1;
  // States to cancel; empty means every non-terminal state.
  repeated string states = 2;
  string mode = 3;
  string pr_ref = 4;
  // Recorded on each cancelled session.
  string reason = 5;
  // Report what would be cancelled without cancelling it.
  bool dry_run = 6;
  // Required when no other filter field is set.
  bool all = 7;
  // Maximum jobs to cancel; 0 lets the server pick a default.
  int32 limit = 8;
}

message CancelledJob {
  string session_id = 1;
  string project = 2;
  // State the session was in when the cancellation was requested.
  string previous_state = 3;
  // Why this job could not be cancelled; empty when it was. A bulk cancel
  // reports per-job failures rather than failing the whole call, since a job
  // reaching a terminal state mid-sweep is expected rather than exceptional.
  string error = 4;
}

message CancelJobsResponse {
  repeated CancelledJob jobs = 1;
}

// RetryJobRequest resubmits the request a finished session was created from.
// The original session is left untouched and a new one is returned: session
// history is a record of what happened, and a retry is a new thing happening.
message RetryJobRequest {
  string session_id = 1;
  // Replaces the original prompt (or feedback) when set.
  string prompt = 2;
}

message RetryJobResponse {
  string session_id = 1;
}

// SetJobPriorityRequest reorders a job that is still in the backlog. Once a job
// has been dispatched its priority no longer orders anything — the admission
// queue holds the request it was submitted with — so this is rejected for any
// state other than pending.
message SetJobPriorityRequest {
  string session_id = 1;
  int32 priority = 2;
}

message SetJobPriorityResponse {
  int32 previous_priority = 1;
}

message GetQueueStatsRequest {}

// Capacity is a three-dimensional resource bundle: CPU in millicpus
// (1 vCPU = 1000), memory and disk in bytes.
message Capacity {
  uint64 cpu_millis = 1;
  uint64 memory_bytes = 2;
  uint64 disk_bytes = 3;
}

message QueueProjectStats {
  string project = 1;
  // Jobs waiting in the durable backlog for this project.
  int32 backlog = 2;
  // Jobs this project holds in the in-memory pipeline.
  int32 dispatched = 3;
}

// GetQueueStatsResponse answers "is the host full, or is my job merely behind
// others" — the question no per-session listing can. Backlog depth and pipeline
// population come with the bounds they are measured against.
message GetQueueStatsResponse {
  // Sessions in the durable backlog.
  int32 backlog = 1;
  // Jobs occupying the in-memory pipeline: cloning, queued for capacity, or
  // running.
  int32 dispatched = 2;
  // Configured bounds; 0 means unbounded.
  int32 max_backlog = 3;
  int32 max_dispatched = 4;
  // Waiters inside the scheduler's admission queue, a subset of dispatched.
  int32 admission_queue = 5;
  // Resource pool: what running VMs hold and what is left.
  Capacity used = 6;
  Capacity free = 7;
  // Per-project split of backlog and pipeline, restricted to the projects the
  // caller may see.
  repeated QueueProjectStats per_project = 8;
  // Host disk guard: the last measured free space on the watched filesystem,
  // the floor it is held against, and whether admission is currently allowed.
  // measured is false until the first sample lands.
  uint64 disk_available_bytes = 9;
  uint64 disk_floor_bytes = 10;
  bool disk_measured = 11;
  bool disk_gate_open = 12;
  // Admission stance: while draining, nothing leaves the backlog, so a job
  // waiting here is waiting on an operator rather than on capacity.
  bool draining = 13;
  string drain_reason = 14;
  google.protobuf.Timestamp draining_since = 15;
}

// SetDrainRequest changes whether the orchestrator dispatches new work. It is
// the controlled half of a shutdown: draining stops the backlog from entering
// the pipeline, so the host runs down to empty on its own and can then be
// stopped without killing anything mid-run.
//
// It is a state, not an action — reversible, and observable through
// GetQueueStats — so a drain started for a deploy that gets called off is
// undone rather than waited out.
message SetDrainRequest {
  bool draining = 1;
  // Recorded alongside the state and reported by GetQueueStats, so an operator
  // finding a drained host learns who drained it and why.
  string reason = 2;
}

message SetDrainResponse {
  // Whether the orchestrator was already in the requested state, which is how
  // a caller tells "I drained it" from "it was already drained".
  bool previously_draining = 1;
  // Sessions returned to the backlog because they had not started running yet.
  // They cost nothing to re-run, and requeueing them is what lets a host reach
  // empty in the time its actual work takes rather than its whole pipeline.
  repeated string requeued = 2;
  // Jobs still in the pipeline once the requeue is signalled. Zero means the
  // host is already idle and safe to stop.
  int32 dispatched = 3;
}

message ListQueueRequest {
  // Filter to a single project; empty means any project the caller may access.
  string project = 1;
  // Maximum entries to return; 0 lets the server pick a default.
  int32 limit = 2;
}

message QueueEntry {
  GetSessionResponse session = 1;
  // 1-based place in dispatch order across the whole backlog, so a filtered
  // listing still says where its entries sit among everything else waiting.
  int32 position = 2;
  // The priority the entry is actually ordered by: its configured priority
  // plus one level per priority_age_step waited, clamped to the highest
  // priority in the backlog.
  int32 effective_priority = 3;
}

// ListQueueResponse returns the backlog in dispatch order, which is not the
// order ListSessions uses and cannot be expressed as a flag on it.
message ListQueueResponse {
  repeated QueueEntry entries = 1;
  // Total backlog depth, which is what the positions are relative to; it can
  // exceed the number of entries returned.
  int32 backlog = 2;
}

service OrchestratorService {
  rpc StartJob(StartJobRequest) returns (StartJobResponse);
  rpc SubmitFeedback(SubmitFeedbackRequest) returns (SubmitFeedbackResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc CancelJobs(CancelJobsRequest) returns (CancelJobsResponse);
  rpc RetryJob(RetryJobRequest) returns (RetryJobResponse);
  rpc SetJobPriority(SetJobPriorityRequest) returns (SetJobPriorityResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc WatchSession(WatchSessionRequest) returns (stream SessionUpdate);
  rpc ListSessionEvents(ListSessionEventsRequest) returns (ListSessionEventsResponse);
  rpc GetQueueStats(GetQueueStatsRequest) returns (GetQueueStatsResponse);
  rpc ListQueue(ListQueueRequest) returns (ListQueueResponse);
  rpc SetDrain(SetDrainRequest) returns (SetDrainResponse);
}
