syntax = "proto3";

package kvarn.v1;

import "kvarn/v1/runner.proto";

message VmInfo {
  int32 cpu_count = 1;
  string cpu_model = 2;
  int64 mem_total_mb = 3;
  int64 mem_available_mb = 4;
  int64 disk_used_mb = 5;
  int64 disk_total_mb = 6;
}

message RegisterRequest {
  string token = 1;
  VmInfo vm_info = 2;
}

message RunnerCommand {
  string command_id = 1;
  oneof command {
    ExecRequest exec = 2;
    UploadFilesRequest upload_files = 3;
    ReadFileRequest read_file = 4;
    EditFileRequest edit_file = 5;
    CreateSessionRequest create_session = 7;
    SessionExecRequest session_exec = 8;
    CloseSessionRequest close_session = 9;
    DownloadFileCommand download_file = 10;
    UploadFileCommand upload_file = 11;
    WriteFileRequest write_file = 12;
    StartProcessRequest start_process = 13;
    StopProcessRequest stop_process = 14;
    ListProcessesRequest list_processes = 15;
    DialConnectionCommand dial_connection = 16;
  }
  reserved 6;
}

// DialConnectionCommand asks the runner to open a TCP connection inside the
// guest and carry it over the bridge. It exists because the guest's own
// loopback is where a great many servers listen — a container published on
// 127.0.0.1, a dev server bound to localhost — and nothing outside the VM can
// reach that address. The runner is inside, so it can.
//
// The two directions travel as separate streams the runner opens once the
// connection is up: ReadConnection carries what the client sent, and
// WriteConnection carries what the server answered.
message DialConnectionCommand {
  string connection_id = 1;
  uint32 port = 2;
}

message DialConnectionResult {
  // Address the runner reached inside the guest, for diagnostics.
  string address = 1;
}

message DownloadFileCommand {
  string transfer_id = 1;
  string path = 2;
}

message UploadFileCommand {
  string transfer_id = 1;
  string path = 2;
}

message CommandResult {
  string command_id = 1;
  string token = 2;
  oneof result {
    ExecResponse exec = 3;
    UploadFilesResponse upload_files = 4;
    ReadFileResponse read_file = 5;
    EditFileResponse edit_file = 6;
    CreateSessionResponse create_session = 9;
    SessionExecResponse session_exec = 10;
    CloseSessionResponse close_session = 11;
    FileStreamResult download_file_result = 12;
    FileStreamResult upload_file_result = 13;
    WriteFileResponse write_file = 14;
    StartProcessResponse start_process = 15;
    StopProcessResponse stop_process = 16;
    ListProcessesResponse list_processes = 17;
    DialConnectionResult dial_connection = 18;
  }
  reserved 8;
  string error = 7;
}

message ReportResultResponse {}

message OutputChunk {
  string command_id = 1;
  string token = 2;
  string stdout = 3;
  string stderr = 4;
}

message ReportOutputResponse {}

message FileStreamChunk {
  oneof payload {
    FileStreamStart start = 1;
    bytes data = 2;
  }
}

message FileStreamStart {
  string transfer_id = 1;
  string token = 2;
  string path = 3;
  int64 size = 4;
  uint32 mode = 5;
}

message FileStreamResult {
  int64 bytes_written = 1;
}

message DownloadFileRequest {
  string transfer_id = 1;
  string token = 2;
}

// ProcessEvent reports something that happened to a long-lived process without
// the orchestrator having asked. An exit cannot ride on CommandResult: that is
// keyed to a command which completed the moment the process started, so by the
// time the process ends there is nothing left to answer.
message ProcessEvent {
  string token = 1;
  string process_id = 2;
  ProcessEventKind kind = 3;
  // ExitCode is set when kind is EXITED.
  int32 exit_code = 4;
  // Error describes a failure to spawn or supervise the process.
  string error = 5;
}

enum ProcessEventKind {
  PROCESS_EVENT_KIND_UNSPECIFIED = 0;
  PROCESS_EVENT_KIND_EXITED = 1;
}

message ReportProcessEventResponse {}

// ConnectionChunk is one message of a proxied connection. The first message of
// a WriteConnection stream is the start metadata that says which connection it
// belongs to; every message after it is data.
message ConnectionChunk {
  oneof payload {
    ConnectionStreamStart start = 1;
    bytes data = 2;
  }
}

message ConnectionStreamStart {
  string connection_id = 1;
  string token = 2;
}

message ReadConnectionRequest {
  string connection_id = 1;
  string token = 2;
}

message WriteConnectionResult {
  int64 bytes_written = 1;
}

service BridgeService {
  rpc Register(RegisterRequest) returns (stream RunnerCommand);
  rpc ReportResult(CommandResult) returns (ReportResultResponse);
  rpc ReportOutput(OutputChunk) returns (ReportOutputResponse);
  rpc ReportProcessEvent(ProcessEvent) returns (ReportProcessEventResponse);
  rpc DownloadFile(DownloadFileRequest) returns (stream FileStreamChunk);
  rpc UploadFile(stream FileStreamChunk) returns (FileStreamResult);
  // ReadConnection streams what the client outside the VM sent, so the runner
  // can write it into the guest socket. It ends when the client half-closes.
  rpc ReadConnection(ReadConnectionRequest) returns (stream ConnectionChunk);
  // WriteConnection streams what the guest server answered back out to the
  // client. It ends when the guest closes its side.
  rpc WriteConnection(stream ConnectionChunk) returns (WriteConnectionResult);
}
