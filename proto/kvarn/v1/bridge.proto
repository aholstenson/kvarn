syntax = "proto3";

package kvarn.v1;

import "kvarn/v1/runner.proto";

message VmInfo {
  int32 cpu_count = 1;
  string cpu_model = 2;
  int64 mem_total_mb = 3;
  int64 mem_available_mb = 4;
  int64 disk_used_mb = 5;
  int64 disk_total_mb = 6;
}

message RegisterRequest {
  string token = 1;
  VmInfo vm_info = 2;
}

message RunnerCommand {
  string command_id = 1;
  oneof command {
    ExecRequest exec = 2;
    UploadFilesRequest upload_files = 3;
    ReadFileRequest read_file = 4;
    EditFileRequest edit_file = 5;
    CreateSessionRequest create_session = 7;
    SessionExecRequest session_exec = 8;
    CloseSessionRequest close_session = 9;
    DownloadFileCommand download_file = 10;
    UploadFileCommand upload_file = 11;
    WriteFileRequest write_file = 12;
    StartProcessRequest start_process = 13;
    StopProcessRequest stop_process = 14;
    ListProcessesRequest list_processes = 15;
  }
  reserved 6;
}

message DownloadFileCommand {
  string transfer_id = 1;
  string path = 2;
}

message UploadFileCommand {
  string transfer_id = 1;
  string path = 2;
}

message CommandResult {
  string command_id = 1;
  string token = 2;
  oneof result {
    ExecResponse exec = 3;
    UploadFilesResponse upload_files = 4;
    ReadFileResponse read_file = 5;
    EditFileResponse edit_file = 6;
    CreateSessionResponse create_session = 9;
    SessionExecResponse session_exec = 10;
    CloseSessionResponse close_session = 11;
    FileStreamResult download_file_result = 12;
    FileStreamResult upload_file_result = 13;
    WriteFileResponse write_file = 14;
    StartProcessResponse start_process = 15;
    StopProcessResponse stop_process = 16;
    ListProcessesResponse list_processes = 17;
  }
  reserved 8;
  string error = 7;
}

message ReportResultResponse {}

message OutputChunk {
  string command_id = 1;
  string token = 2;
  string stdout = 3;
  string stderr = 4;
}

message ReportOutputResponse {}

message FileStreamChunk {
  oneof payload {
    FileStreamStart start = 1;
    bytes data = 2;
  }
}

message FileStreamStart {
  string transfer_id = 1;
  string token = 2;
  string path = 3;
  int64 size = 4;
  uint32 mode = 5;
}

message FileStreamResult {
  int64 bytes_written = 1;
}

message DownloadFileRequest {
  string transfer_id = 1;
  string token = 2;
}

// ProcessEvent reports something that happened to a long-lived process without
// the orchestrator having asked. An exit cannot ride on CommandResult: that is
// keyed to a command which completed the moment the process started, so by the
// time the process ends there is nothing left to answer.
message ProcessEvent {
  string token = 1;
  string process_id = 2;
  ProcessEventKind kind = 3;
  // ExitCode is set when kind is EXITED.
  int32 exit_code = 4;
  // Error describes a failure to spawn or supervise the process.
  string error = 5;
}

enum ProcessEventKind {
  PROCESS_EVENT_KIND_UNSPECIFIED = 0;
  PROCESS_EVENT_KIND_EXITED = 1;
}

message ReportProcessEventResponse {}

service BridgeService {
  rpc Register(RegisterRequest) returns (stream RunnerCommand);
  rpc ReportResult(CommandResult) returns (ReportResultResponse);
  rpc ReportOutput(OutputChunk) returns (ReportOutputResponse);
  rpc ReportProcessEvent(ProcessEvent) returns (ReportProcessEventResponse);
  rpc DownloadFile(DownloadFileRequest) returns (stream FileStreamChunk);
  rpc UploadFile(stream FileStreamChunk) returns (FileStreamResult);
}
